{% extends "site/base.html" %}
{% block title %}Contact - SkillRush{% endblock %}
{% block content %}
<div class="site-page"><div class="container py-4">
  <h1 class="site-title">Contact</h1>
  <p class="site-lead">Une question sur SkillRush ? Ecris-nous.</p>
  <div class="row g-3 mt-2">
    <div class="col-lg-7">
      <div class="site-card">
        <form>
          <div class="mb-3"><label class="form-label">Nom</label><input class="form-control" placeholder="Votre nom"></div>
          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="vous@email.com"></div>
          <div class="mb-3"><label class="form-label">Message</label><textarea class="form-control" rows="4" placeholder="Votre message"></textarea></div>
          <button type="button" class="btn site-btn-primary">Envoyer</button>
        </form>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="site-card h-100">
        <h5>Coordonnees</h5>
        <p class="text-muted mb-2"><i class="fas fa-envelope me-2"></i>support@skillrush.local</p>
        <p class="text-muted mb-2"><i class="fas fa-map-marker-alt me-2"></i>Casablanca, Maroc</p>
        <p class="text-muted mb-0"><i class="fas fa-clock me-2"></i>Lun-Ven, 9h-18h</p>
      </div>
    </div>
  </div>
</div></div>
{% endblock %}
