{% extends "base.html" %}

{% block title %}Créer une compétence - SkillRush{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4">Créer une nouvelle compétence</h2>
            
            <div class="card">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('skill.create_skill') }}">
                        <div class="mb-3">
                            <label for="title" class="form-label">Titre de la compétence *</label>
                            <input type="text" class="form-control" id="title" name="title" required 
                                   placeholder="Ex: Excel Avancé, Canva pour Débutants">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description *</label>
                            <textarea class="form-control" id="description" name="description" rows="4" required
                                      placeholder="Décrivez ce que les apprenants découvriront..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">Catégorie *</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="">Choisir une catégorie</option>
                                    <option value="Excel">Excel</option>
                                    <option value="Canva">Canva</option>
                                    <option value="CV">CV</option>
                                    <option value="Design">Design</option>
                                    <option value="Programming">Programmation</option>
                                    <option value="Business">Business</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Other">Autre</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="difficulty" class="form-label">Niveau de difficulté</label>
                                <select class="form-select" id="difficulty" name="difficulty">
                                    <option value="Beginner" selected>Débutant</option>
                                    <option value="Intermediate">Intermédiaire</option>
                                    <option value="Advanced">Avancé</option>
                                </select>
                            </div>
                        </div>

                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i>
                            Vous pourrez ajouter des vidéos après la création de la compétence.
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Créer la compétence
                            </button>
                            <a href="{{ url_for('main.explore_skills') }}" class="btn btn-outline-secondary">
                                Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
