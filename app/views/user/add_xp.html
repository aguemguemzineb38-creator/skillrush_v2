{% extends "base.html" %}
{% block title %}Ajouter des XP - SkillRush{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header"><h4><i class="fas fa-star"></i> Ajouter des XP</h4></div>
                <div class="card-body">
                    <p class="text-muted">XP actuels : <strong>{{ current_user.xp }}</strong> | Niveau actuel : <strong>{{ current_user.level }}</strong></p>
                    <form method="POST">
                        <div class="mb-3">
                            <label for="xp" class="form-label">Nombre d'XP à ajouter</label>
                            <input type="number" class="form-control" id="xp" name="xp" min="1" max="10000" value="100" required>
                        </div>
                        <button type="submit" class="btn btn-info w-100">
                            <i class="fas fa-plus"></i> Ajouter les XP
                        </button>
                    </form>
                    <a href="{{ url_for('user.profile', user_id=current_user.id) }}" class="btn btn-link mt-2">← Retour au profil</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
